  <defs>
    <linearGradient id="chrome" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7a8086"/><stop offset="1" stop-color="#62686e"/></linearGradient>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#26262b"/><stop offset="1" stop-color="#1b1b1e"/></linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2e2e34"/><stop offset="1" stop-color="#202024"/></linearGradient>
    <linearGradient id="progress" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4cd964"/><stop offset=".25" stop-color="#34aadc"/><stop offset=".5" stop-color="#5856d6"/>
      <stop offset=".75" stop-color="#ff2d55"/><stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
    <clipPath id="win"><rect x="20" y="20" width="480" height="320" rx="22"/></clipPath>
  </defs>

  <!-- window -->
  <rect x="14" y="16" width="492" height="332" rx="26" fill="#000" fill-opacity=".18"/>
  <rect x="20" y="20" width="480" height="320" rx="22" fill="#43494f"/>
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="480" height="58" fill="url(#chrome)"/>
    <rect x="20" y="82" width="480" height="258" fill="url(#page)"/>
    <!-- progress bar under the toolbar -->
    <rect x="20" y="78" width="480" height="4" fill="#2a2e32"/>
    <rect x="20" y="78" width="330" height="4" fill="url(#progress)"/>
  </g>
  <rect x="21" y="21" width="478" height="318" rx="21" fill="none" stroke="#7a8086" stroke-opacity=".55" stroke-width="2"/>
  <!-- traffic dots -->
  <g fill="#c4c9ce">
    <circle cx="50" cy="49" r="7"/><circle cx="74" cy="49" r="7"/><circle cx="98" cy="49" r="7"/>
  </g>
  <!-- address bar -->
  <rect x="124" y="36" width="352" height="26" rx="13" fill="#43494f"/>
  <rect x="140" y="46" width="120" height="6" rx="3" fill="#9aa0a6"/>

  <!-- cards -->
  <g transform="translate(262 212) scale(.56)">
    <g transform="rotate(-16) translate(-26 4)">
      <rect x="-86" y="-124" width="172" height="236" rx="18" fill="#6a7076"/>
      <rect x="-76" y="-114" width="152" height="216" rx="12" fill="url(#card)"/>
    </g>
    <g transform="rotate(14) translate(38 4)">
      <rect x="-86" y="-124" width="172" height="236" rx="18" fill="#8a9096"/>
      <rect x="-76" y="-114" width="152" height="216" rx="12" fill="url(#card)"/>
    </g>
    <g transform="translate(6 -10)">
      <rect x="-92" y="-130" width="184" height="250" rx="18" fill="#fefefe"/>
      <rect x="-81" y="-119" width="162" height="228" rx="12" fill="url(#card)"/>
      <g transform="translate(0 -5) scale(1.25)">
      <g transform="translate(-54 -54) scale(4.5)" fill="none" stroke="#fefefe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 22h14"/><path d="M5 2h14"/>
        <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/>
        <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>
      </g>
      </g>
    </g>
  </g>
</svg>
