name: Bug report
description: Something is not working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Any detail helps, but don't worry if you don't know all of it. If you have a moment, a quick look through [open issues](https://github.com/wielorzeczownik/docker-steam-game-idler/issues) helps avoid duplicates.

        Problems inside the app itself (idling, achievements, card farming) that also happen outside Docker belong to [Steam Game Idler](https://github.com/zevnda/steam-game-idler/issues).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: dropdown
    id: arch
    attributes:
      label: Host architecture
      description: The app is x86_64 only, so on ARM it runs under emulation.
      options:
        - x86_64 (native)
        - ARM, Apple Silicon (Rosetta)
        - ARM, Linux (QEMU)
    validations:
      required: true

  - type: input
    id: docker_version
    attributes:
      label: Docker version
      placeholder: 'e.g. 27.0.0'

  - type: input
    id: image_version
    attributes:
      label: Image version
      placeholder: 'e.g. latest, v1.2.0, sgi-6.5.2'

  - type: textarea
    id: logs
    attributes:
      label: Container logs
      description: Output of `docker logs steam-game-idler`. If the app itself misbehaves, also attach `config/com.zevnda.steam-game-idler/cache/steamutility.log`.
      render: text
